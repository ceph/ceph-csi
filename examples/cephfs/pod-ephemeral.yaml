---
kind: Pod
apiVersion: v1
metadata:
  name: csi-cephfs-demo-ephemeral-pod
spec:
  securityContext:
    fsGroup: 2000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: centos
      image: quay.io/centos/centos:latest
      command: ["/bin/sleep", "infinity"]
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - mountPath: /myspace
          name: mypvc
  volumes:
    - name: mypvc
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: csi-cephfs-sc
            resources:
              requests:
                storage: 1Gi
