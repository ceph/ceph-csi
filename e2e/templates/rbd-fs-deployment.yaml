---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-fs-rx-volume
  labels:
    app: pod-fs-rx-volume
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pod-fs-rx-volume
  template:
    metadata:
      labels:
        app: pod-fs-rx-volume
    spec:
      containers:
        - name: centos
          image: "quay.io/centos/centos:latest"
          command: ["/bin/sleep", "infinity"]
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: mypvc
              mountPath: /var/lib/www/html
      volumes:
        - name: mypvc
          persistentVolumeClaim:
            claimName: rbd-pvc
            readOnly: false
