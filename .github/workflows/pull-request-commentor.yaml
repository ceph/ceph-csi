---
name: Add comment
# yamllint disable-line rule:truthy
on:
  pull_request_target:
    branches:
      - devel
      - "release-v*"
    types:
      - labeled

permissions:
  pull-requests: write

jobs:
  trigger-ci-jobs:
    runs-on: ubuntu-latest

    if: >
      github.repository == 'ceph/ceph-csi' &&
      (github.event.label.name == 'ok-to-test' &&
      github.event.pull_request.merged != true)

    steps:
      - name: Add comment to trigger CI tests for release-v3.16
        if: github.base_ref == 'release-v3.16'
        # yamllint disable-line rule:line-length
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        with:
          token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            /test ci/centos/k8s-e2e-external-storage/1.32
            /test ci/centos/k8s-e2e-external-storage/1.33
            /test ci/centos/k8s-e2e-external-storage/1.34
            /test ci/centos/mini-e2e-helm/k8s-1.32
            /test ci/centos/mini-e2e-helm/k8s-1.33
            /test ci/centos/mini-e2e-helm/k8s-1.34
            /test ci/centos/mini-e2e/k8s-1.32
            /test ci/centos/mini-e2e/k8s-1.33
            /test ci/centos/mini-e2e/k8s-1.34
            /test ci/centos/upgrade-tests-cephfs
            /test ci/centos/upgrade-tests-rbd

      - name: Add comment to trigger CI tests for release-v3.17
        if: github.base_ref == 'release-v3.17'
        # yamllint disable-line rule:line-length
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        with:
          token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            /test ci/centos/k8s-e2e-external-storage/1.33
            /test ci/centos/k8s-e2e-external-storage/1.34
            /test ci/centos/k8s-e2e-external-storage/1.35
            /test ci/centos/mini-e2e-helm/k8s-1.33
            /test ci/centos/mini-e2e-helm/k8s-1.34
            /test ci/centos/mini-e2e-helm/k8s-1.35
            /test ci/centos/mini-e2e/k8s-1.33
            /test ci/centos/mini-e2e/k8s-1.34
            /test ci/centos/mini-e2e/k8s-1.35
            /test ci/centos/upgrade-tests-cephfs
            /test ci/centos/upgrade-tests-rbd

      - name: Add comment to trigger CI tests for devel branch
        # Helm is deprecated on devel and no longer tested there.
        if: github.base_ref == 'devel'
        # yamllint disable-line rule:line-length
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043  # v4.0.0
        with:
          token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            /test ci/centos/k8s-e2e-external-storage/1.34
            /test ci/centos/k8s-e2e-external-storage/1.35
            /test ci/centos/k8s-e2e-external-storage/1.36
            /test ci/centos/mini-e2e/k8s-1.34
            /test ci/centos/mini-e2e/k8s-1.35
            /test ci/centos/mini-e2e/k8s-1.36
            /test ci/centos/mini-e2e/k8s-1.37/nfs
            /test ci/centos/upgrade-tests-cephfs
            /test ci/centos/upgrade-tests-rbd

  remove-label:
    runs-on: ubuntu-latest

    # run after the other jobs
    needs:
      - trigger-ci-jobs

    if: >
      (github.event.label.name == 'ok-to-test' &&
      github.event.pull_request.merged != true)

    steps:
      - name: add ci/in-progress/e2e label before removing ok-to-test
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["ci/in-progress/e2e"]
            })

      - name: remove ok-to-test-label after commenting
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: ["ok-to-test"]
            })
