---
name: Add comment
# yamllint disable-line rule:truthy
on:
  pull_request_target:
    branches:
      - devel
      - "release-v*"
    types:
      - labeled

permissions:
  contents: read
  pull-requests: write

jobs:
  add-test-comment:
    runs-on: ubuntu-latest

    if: >
      (github.event.label.name == 'ok-to-test' &&
      github.event.pull_request.merged != true)

    steps:
      - name: Add one comment to trigger E2E tests
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          script: |
            const branch = context.payload.pull_request.base.ref;
            const kubeVersions = {
              'release-v3.17': ['1.33', '1.34', '1.35'],
              'release-v3.18': ['1.34', '1.35', '1.36'],
              'devel': ['1.36', '1.37'],
            };
            const tests = [];

            if (
              `${context.repo.owner}/${context.repo.repo}` === 'ceph/ceph-csi'
            ) {
              for (const version of kubeVersions[branch] || []) {
                tests.push(`ci/centos/k8s-e2e-external-storage/${version}`);
                tests.push(`ci/centos/mini-e2e/k8s-${version}`);

                // TODO: Remove it when we phase out 3.17 from the matrix.
                // Helm is only tested on release-v3.17/lower.
                if (branch === 'release-v3.17') {
                  tests.push(`ci/centos/mini-e2e-helm/k8s-${version}`);
                }
              }

              // NFS runs only on devel.
              if (branch === 'devel') {
                tests.push('ci/centos/mini-e2e/k8s-1.37/nfs');
              }
            }

            // Run upgrade tests unconditionally.
            tests.push('ci/centos/upgrade-tests-cephfs');
            tests.push('ci/centos/upgrade-tests-rbd');

            // Re-read the HEAD from the API.
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const sha = pr.data.head.sha;

            // Statuses belong to a single commit, and a status can only
            // be set after that commit was pushed. A job that has a
            // status on the current HEAD was therefore triggered after
            // the last commit, and does not need to run again. A new
            // commit (or a rebase) moves HEAD to a commit without any
            // statuses, so the whole matrix is commented again.
            const combined =
              await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                per_page: 100,
              });

            const states = new Map(
              combined.data.statuses.map(s => [s.context, s.state])
            );

            // Skip jobs that passed, and jobs that are still running
            // against this commit.
            const done = ['success', 'pending'];
            const todo = tests.filter(
              test => !done.includes(states.get(test))
            );

            const skipped = tests.filter(test => !todo.includes(test));
            if (skipped.length !== 0) {
              core.info(
                `not triggering for ${sha}: ${skipped.join(', ')}`
              );
            }

            if (todo.length === 0) {
              core.notice(
                `all e2e jobs already ran for ${sha}, nothing to do`
              );

              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: todo.map(test => `/test ${test}`).join('\n'),
            });

  remove-label:
    runs-on: ubuntu-latest

    # Update labels only after all test commands have been posted.
    needs: add-test-comment

    if: >
      (github.event.label.name == 'ok-to-test' &&
      github.event.pull_request.merged != true)

    steps:
      - name: add ci/in-progress/e2e label before removing ok-to-test
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["ci/in-progress/e2e"]
            })

      - name: remove ok-to-test-label after commenting
        # yamllint disable-line rule:line-length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ secrets.CEPH_CSI_BOT_TOKEN }}
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: ["ok-to-test"]
            })
