---
# Acceptance quick e2e: minikube + Rook Ceph smoke on every PR.
# Complements (does NOT replace) CentOS mini-e2e via ok-to-test.
# Runs once per supported base image: Rocky Linux 10 (the build.env default)
# and a Rocky Linux 9 variant that matches the -rocky9 published images.
name: e2e-minikube-acceptance
"on":
  pull_request:
    branches:
      - devel
      - "release-v*"
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!.github/workflows/**"
      - ".github/workflows/e2e-minikube-acceptance.yaml"

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  e2e-acceptance:
    name: e2e-acceptance-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base image as configured in build.env (Rocky Linux 10)
          - variant: default
          # Rocky Linux 9 runtime, matching the -rocky9 published images
          - variant: rocky9
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Patch build.env for Rocky Linux 9
        if: matrix.variant == 'rocky9'
        run: |
          # shellcheck source=build.env
          source build.env
          final_base_image=quay.io/rockylinux/rockylinux:9-minimal
          image_version=${CSI_IMAGE_VERSION}-rocky9
          sed -i \
            -e 's|^BASE_IMAGE=.*|BASE_IMAGE=quay.io/rockylinux/rockylinux:9|' \
            -e "s|^FINAL_BASE_IMAGE=.*|FINAL_BASE_IMAGE=${final_base_image}|" \
            -e '/^CEPH_RELEASE_RPM=/s/el10/el9/g' \
            -e "s|^CSI_IMAGE_VERSION=.*|CSI_IMAGE_VERSION=${image_version}|" \
            build.env

      - name: Source build.env
        run: |
          set -a
          # shellcheck disable=SC1091
          source build.env
          set +a
          {
            echo "KUBE_VERSION=${KUBE_VERSION}"
            echo "MINIKUBE_VERSION=${MINIKUBE_VERSION}"
            echo "ROOK_VERSION=${ROOK_VERSION}"
            echo "ROOK_CEPH_CLUSTER_IMAGE=${ROOK_CEPH_CLUSTER_IMAGE}"
            echo "SNAPSHOT_VERSION=${SNAPSHOT_VERSION}"
            echo "VM_DRIVER=${VM_DRIVER}"
            echo "CSI_IMAGE_VERSION=${CSI_IMAGE_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Install minikube prerequisites
        run: >-
          scripts/github-action-helper.sh
          install_minikube_prereqs

      - name: Setup minikube
        run: |
          sudo sysctl fs.protected_regular=0
          scripts/minikube.sh up
        env:
          MEMORY: "6144"

      - name: Prepare disk for OSD
        run: >-
          scripts/github-action-helper.sh prepare_disk

      - name: Pre-pull Ceph image
        run: >-
          docker pull "$ROOK_CEPH_CLUSTER_IMAGE"

      - name: Build ceph-csi image
        run: make image-cephcsi-builder image-cephcsi
        env:
          CONTAINER_CMD: docker

      - name: Build e2e.test
        run: >-
          make containerized-build TARGET=e2e.test USE_PULLED_IMAGE=yes
          CONTAINER_CMD=docker DEVEL_IMAGE=quay.io/cephcsi/cephcsi:builder
          DEVEL_CONTAINER_ID=.builder-container-id

      - name: Load ceph-csi image
        run: scripts/minikube.sh cephcsi

      - name: Load sidecar images
        run: scripts/minikube.sh k8s-sidecar

      - name: Deploy ceph-csi-operator
        run: >-
          scripts/deploy-ceph-csi-operator.sh deploy

      - name: Install snapshot controller
        run: >-
          scripts/minikube.sh install-snapshotter

      - name: Deploy Rook + Ceph
        run: scripts/minikube.sh deploy-rook
        env:
          ROOK_DEPLOY_TIMEOUT: "600"
          KUBECTL_RETRY_DELAY: "5"

      - name: Run acceptance e2e
        run: |
          cd e2e && ../e2e.test \
            -test.v -ginkgo.v \
            --ginkgo.label-filter=acceptance \
            --ginkgo.timeout=25m \
            --deploy-timeout=10 \
            --test-rbd=true \
            --test-cephfs=true \
            --test-nfs=true \
            --test-nvmeof=false \
            --deploy-rbd=false \
            --deploy-cephfs=false \
            --operator-deployment \
            --skip-vault=true

      - name: Collect logs on failure
        if: '!success()'
        run: >-
          scripts/github-action-helper.sh collect_logs

      - name: Upload failure logs
        if: '!success()'
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-e2e-logs-${{ matrix.variant }}
          path: /tmp/acceptance-e2e-logs/
          retention-days: 7
