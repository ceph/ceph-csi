---
# Tier-1 quick e2e: minikube + Rook Ceph smoke on every PR.
# Complements (does NOT replace) CentOS mini-e2e via ok-to-test.
name: e2e-minikube-tier1
"on":
  pull_request:
    branches:
      - devel
      - "release-v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUBE_VERSION: v1.36.0
  GO_VERSION_FILE: go.mod

jobs:
  e2e-tier1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}

      - name: Source build.env
        run: |
          set -a
          # shellcheck disable=SC1091
          source build.env
          set +a
          {
            echo "MINIKUBE_VERSION=${MINIKUBE_VERSION}"
            echo "ROOK_VERSION=${ROOK_VERSION}"
            echo "ROOK_CEPH_CLUSTER_IMAGE=\
          ${ROOK_CEPH_CLUSTER_IMAGE}"
            echo "SNAPSHOT_VERSION=${SNAPSHOT_VERSION}"
            echo "VM_DRIVER=${VM_DRIVER}"
            echo "CSI_IMAGE_VERSION=\
          ${CSI_IMAGE_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Install cri-dockerd
        run: |
          CRI_DOCKERD_VERSION="0.3.17"
          CRI_DOCKERD_BASE="https://github.com/Mirantis"
          CRI_DOCKERD_BASE+="/cri-dockerd/releases/download"
          CRI_DOCKERD_URL="${CRI_DOCKERD_BASE}"
          CRI_DOCKERD_URL+="/v${CRI_DOCKERD_VERSION}"
          TGZ="cri-dockerd-${CRI_DOCKERD_VERSION}"
          TGZ+=".amd64.tgz"
          curl -sLO "${CRI_DOCKERD_URL}/${TGZ}"
          tar -xzf "${TGZ}"
          sudo install -o root -g root -m 0755 \
            cri-dockerd/cri-dockerd \
            /usr/local/bin/cri-dockerd
          rm -rf cri-dockerd "${TGZ}"
          RAW_BASE="https://raw.githubusercontent.com"
          RAW_BASE+="/Mirantis/cri-dockerd"
          RAW_BASE+="/v${CRI_DOCKERD_VERSION}"
          for unit in cri-docker.service \
              cri-docker.socket; do
            curl -sLO \
              "${RAW_BASE}/packaging/systemd/${unit}"
            sudo install -o root -g root -m 0644 \
              "${unit}" /etc/systemd/system/
          done
          sudo sed -i \
            's|/usr/bin/cri-dockerd|'\
          '/usr/local/bin/cri-dockerd|' \
            /etc/systemd/system/cri-docker.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now cri-docker.socket

      - name: Setup minikube
        run: |
          KUBE_VERSION="${KUBE_VERSION}" \
            scripts/minikube.sh up
        env:
          MEMORY: "6144"

      - name: Prepare disk for OSD
        run: >-
          scripts/github-action-helper.sh prepare_disk

      - name: Deploy Rook + Ceph
        run: scripts/minikube.sh deploy-rook

      - name: Install snapshot controller
        run: >-
          scripts/minikube.sh install-snapshotter

      - name: Set up Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: >-
            ${{ runner.os }}-buildx-${{
            hashFiles(
            'deploy/cephcsi/image/Dockerfile',
            'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ceph-csi image
        run: |
          GOVER=$(grep -oP 'go \K[0-9.]+' \
            go.mod | head -1)
          docker buildx build \
            --load \
            -t "quay.io/cephcsi/cephcsi:\
          ${CSI_IMAGE_VERSION}" \
            -f deploy/cephcsi/image/Dockerfile \
            --cache-from \
              type=local,src=/tmp/.buildx-cache \
            --cache-to \
              type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --build-arg BASE_IMAGE=quay.io/ceph/ceph:v20 \
            --build-arg GO_ARCH=amd64 \
            --build-arg "GOLANG_VERSION=${GOVER}" \
            .

      - name: Rotate buildx cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new \
            /tmp/.buildx-cache

      - name: Load ceph-csi + sidecar images
        run: |
          scripts/minikube.sh cephcsi
          scripts/minikube.sh k8s-sidecar

      - name: Build e2e.test
        run: make e2e.test

      - name: Run tier1 e2e
        run: |
          cd e2e && ../e2e.test \
            -test.v -ginkgo.v \
            --ginkgo.label-filter=tier1 \
            --ginkgo.timeout=15m \
            --deploy-timeout=10 \
            --test-rbd=true \
            --test-cephfs=true \
            --test-nfs=true \
            --test-nvmeof=true \
            --deploy-rbd=true \
            --deploy-cephfs=true \
            --skip-vault=true \
            --cephcsi-namespace=default

      - name: Collect logs on failure
        if: failure()
        run: >-
          scripts/github-action-helper.sh collect_logs

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-e2e-logs
          path: /tmp/tier1-e2e-logs/
          retention-days: 7
